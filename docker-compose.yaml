version: '3.8'

services:
  saas-to-mcp-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: saas-to-mcp-gateway:latest
    container_name: saas-to-mcp-gateway
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Persistent configuration & secrets volume
      - gateway-data:/app/data
      # Optional local GCP service account mount if needed
      - ./google-service-account.json:/app/google-service-account.json:ro
    restart: unless-stopped

volumes:
  gateway-data:
